<div class="wrap">

    <div class="brand">Salon Prices<small>Twin Cities</small></div>

    <div id="svcPay"></div>

<script>
const $ = s => document.querySelector(s);
const {MIN, RAD, miles, q} = SalonCore;
// The free slice: one shop's own prices against the middle price nearby, with the three nearest
// shops by name (/api/preview). Once a password opens the full table (/api/data), every shop and
// price is here and the same arithmetic (salon_core.js) runs in the page.
let FULL = false, LOOKUP = {keys:{}, cities:{}};
const TOKEN = (location.pathname.match(/^\/for\/([a-z0-9]{6,16})\/?$/) || [])[1] || null;
const preview = qs => fetch("/api/preview?" + qs).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const TIER_WORD = {junior:"new / junior stylists", stylist:"standard stylists", senior:"senior stylists", master:"master stylists", owner:"owners and directors"};
const TYPE_WORD = {salon:"salons", barbershop:"barbershops", nail:"nail salons", lash_brow:"brow and lash studios", braiding:"braiding shops", suite:"independent stylists", other:"shops"};
const TYPE_ONE = {salon:"Salon", barbershop:"Barbershop", nail:"Nail salon", lash_brow:"Brow & lash", braiding:"Braids", suite:"Independent stylist", other:"Beauty"};
const SIZE_WORD = {small:"small", smedium:"small-medium", medium:"medium", large:"large", jumbo:"jumbo", mega:"mega volume", volume:"volume", hybrid:"hybrid", classic:"classic"};
let SHOPS = [], SVC = {}, ORDER = [], META = {};

const money = n => "$" + (Math.round(n) === n ? n : n.toFixed(0));
function svcName(code, size){ const l = (SVC[code]||{}).label || code; return size ? `${l} · ${SIZE_WORD[size]||size}` : l; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// how a price reads: "$45", "$45+", "$75–95"
const shown = x => x.top ? `${money(x.price)}–${Math.round(x.top)}` : money(x.price) + (x.from ? "+" : "");

function where(c, shop, from){
  const kind = c.scope === "type" ? TYPE_WORD[shop.type] : "shops";
  const how = from ? "that also post a starting price" : "that post a set price";
  return c.r === 99 ? `${c.n} ${kind} across the Twin Cities ${how}` : `${c.n} ${kind} within ${c.r} miles ${how}`;
}
// where a price would land in a comparison group, in words
function land(c, price, from){
  const below = c.prices.filter(x => x < price).length, above = c.prices.filter(x => x > price).length;
  const diff = price - c.med, cls = Math.abs(diff) / c.med <= 0.05 ? "mid" : diff < 0 ? "under" : "over";
  const mid = from ? "middle starting price" : "middle price";
  const say = cls === "mid" ? `<b class="mid">right at the ${mid}</b>` : `<b class="${cls}">${money(Math.round(Math.abs(diff)))} ${cls === "under" ? "under" : "over"}</b> the ${mid}`;
  return {cls, say, below, above};
}

function bar(c, price, cls){
  const lo = Math.min(c.lo, price), hi = Math.max(c.hi, price);
  const pad = (hi - lo) * 0.06 || 5, a = lo - pad, b = hi + pad;
  const x = v => ((v - a) / (b - a) * 100).toFixed(1) + "%";
  return `<div class="bar" aria-hidden="true"><div class="track"></div>
    <div class="band" style="left:${x(c.p25)};width:calc(${x(c.p75)} - ${x(c.p25)})"></div>
    <div class="med" style="left:${x(c.med)}"></div><div class="you ${cls}" style="left:${x(price)}"></div></div>
    <div class="scale"><span>${money(Math.round(lo))}</span><span>middle ${money(Math.round(c.med))}</span><span>${money(Math.round(hi))}</span></div>`;
}

async function shopRows(shop){
  if (FULL) return shop.p.map(p => ({p, c: SalonCore.compare(SHOPS, shop, p)})).filter(r => r.c);
  const d = await preview("shop=" + encodeURIComponent(shop.id));
  Paywall.track("preview_open", {shop: shop.id});
  return d.rows;
}
async function showShop(shop){
  $("#q").value = shop.name;
  $("#results").classList.add("hidden");
  const picked = document.activeElement === $("#q") || shop._picked;
  $("#q").blur(); delete shop._picked;
  try { history.replaceState(null, "", "#" + encodeURIComponent(shop.id)); } catch(e) {}
  const rows = [];
  let got;
  try { got = await shopRows(shop); } catch (e) { $("#shopOut").innerHTML = head(shop) + `<p class="none">Couldn't load this shop's prices. Refresh to try again.</p>`; return; }
  for (const {p, c} of got){
    const diff = p[3] - c.med, pct = Math.abs(diff) / c.med;
    const cls = pct <= 0.05 ? "mid" : diff < 0 ? "under" : "over";
    rows.push({p, c, diff, cls, pct});
  }
  rows.sort((a, b) => (b.pct - a.pct));
  const n = {under:0, mid:0, over:0}; rows.forEach(r => n[r.cls]++);
  let big, sub;
  if (!rows.length){
    $("#shopOut").innerHTML = head(shop) + `<p class="none">We don't have enough shops nearby with the same services to compare yet.</p>`;
    return;
  }
  const most = n.under > n.over && n.under >= n.mid ? "under" : n.over > n.under && n.over >= n.mid ? "over" : "mid";
  const top = rows[0];
  if (most === "under") big = `You charge less than the middle price on ${n.under} of ${rows.length} services.`;
  else if (most === "over") big = `You charge more than the middle price on ${n.over} of ${rows.length} services.`;
  else big = `Your prices sit right in the middle for your area.`;
  sub = top.cls === "mid" ? "" : `Biggest gap: ${svcName(top.p[0], top.p[1])}, ${money(Math.round(Math.abs(top.diff)))} ${top.cls === "under" ? "below" : "above"} the middle price.`;
  const html = rows.map((r, i) => {
    const [code, size, tier, price, from] = r.p;
    const tierTxt = tier !== "unknown" ? ` for ${TIER_WORD[tier]}` : "";
    const top = r.p[6];
    const say = land(r.c, price, from).say.replace(/^<b class="mid">right/, '<b class="mid">Right') + tierTxt;
    const list = [...r.c.g].sort((a, b) => a.price - b.price);
    const mine = {shop, price, from:!!from, top, d:0, me:true};
    const merged = [...list, mine].sort((a, b) => a.price - b.price);
    const more = r.c.n - r.c.g.length;
    const ev = merged.map(x => `<tr class="${x.me ? "me" : ""}"><td>${esc(x.me ? "You — " + x.shop.name : x.shop.name)}<small>${x.me ? "" : esc(x.shop.city) + (r.c.r < 99 ? ` · ${x.d.toFixed(1)} mi` : "")}${x.shop.nt ? (x.me ? "" : " · ") + "tip included" : ""}</small></td><td>${shown(x)}</td></tr>`).join("");
    const label = top ? `${money(price)}–${Math.round(top)}` : (from ? "from " : "") + money(price);
    const tip = shop.nt ? `<div class="who">Your price includes the tip. Clients of the shops compared tip on top.</div>` : "";
    return `<div class="row" tabindex="0" role="button" aria-expanded="false" data-i="${i}">
      <div class="top"><span class="svc">${esc(svcName(code, size))}</span><span class="price">${label}</span></div>
      <p class="say">${say}</p><div class="barbox">${bar(r.c, price, r.cls)}</div>
      <div class="who">Compared with ${where(r.c, shop, from)}. Tap to see them, or try a new price.</div>${tip}
      <div class="evidence"><div class="try"><label for="try${i}">Try a ${from ? "starting " : ""}price</label><input id="try${i}" type="text" inputmode="decimal" aria-label="Try a price" value="${Math.round(price)}"><output></output></div><table>${ev}</table>${more > 0 ? Paywall.lockRow(`${more} more shops, by name and price`) : ""}</div></div>`;
  }).join("");
  $("#shopOut").innerHTML = head(shop) + `<div class="verdict"><p class="big">${big}</p><p class="sub">${sub}</p>
    <div class="tally"><div class="t-under"><b>${n.under}</b>under</div><div class="t-mid"><b>${n.mid}</b>same</div><div class="t-over"><b>${n.over}</b>over</div></div></div>
    <div class="rows">${html}</div>`;
  if (picked) requestAnimationFrame(() => $(".verdict").scrollIntoView({behavior:"smooth", block:"start"}));
  document.querySelectorAll(".row").forEach(el => {
    const t = () => { el.classList.toggle("open"); el.setAttribute("aria-expanded", el.classList.contains("open")); };
    el.addEventListener("click", e => { if (!e.target.closest(".try") && !e.target.closest(".pw-lock")) t(); });
    el.addEventListener("keydown", e => { if (e.target.closest(".try")) return; if (e.key === "Enter" || e.key === " "){ e.preventDefault(); t(); } });
    const r = rows[+el.dataset.i], inp = el.querySelector(".try input"), out = el.querySelector(".try output");
    const tryIt = () => {
      const v = parseFloat(inp.value.replace(/[^0-9.]/g, ""));
      if (!(v > 0)){ out.innerHTML = ""; return; }
      const L = land(r.c, v, r.p[4]);
      out.innerHTML = `At ${money(Math.round(v))}${r.p[4] ? "+" : ""} you'd be ${L.say}. ${L.below} of ${r.c.n} charge less, ${L.above} charge more.`;
      el.querySelector(".barbox").innerHTML = bar(r.c, v, L.cls);
    };
    inp.addEventListener("input", tryIt);
    tryIt();
  });
}
function head(shop){
  const link = shop.url ? ` <a class="chip" href="${esc(shop.url)}" target="_blank" rel="noopener">menu ↗</a>` : "";
  const nt = shop.nt ? `<span class="chip nt">No tipping · prices include the tip</span>` : "";
  return `<div class="shopline"><h2>${esc(shop.name)}</h2><span class="chip">${TYPE_ONE[shop.type]||"Shop"} · ${esc(shop.city||"")}</span>${nt}${link}</div>`;
}

// search
function norm(s){ return s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim(); }
function search(v){
  const t = norm(v);
  const box = $("#results");
  if (t.length < 2){ box.classList.add("hidden"); return; }
  const hits = SHOPS.filter(s => s._n.includes(t)).sort((a, b) => (a._n.startsWith(t) ? 0 : 1) - (b._n.startsWith(t) ? 0 : 1) || b.n - a.n).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(s => `<button type="button" data-id="${esc(s.id)}">${esc(s.name)}<span>${TYPE_ONE[s.type]||""} · ${esc(s.city||"")} · ${s.n} services</span></button>`).join("")
    : `<button type="button" disabled>No shop by that name yet<span>Try “A service” to see prices near you</span></button>`;
  box.classList.remove("hidden");
  box.querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => { const s = SHOPS.find(s => s.id === b.dataset.id); s._picked = true; showShop(s); }));
}

// service mode
let HERE = null;
function fillSvc(){
  const fam = {hair:"Hair", color:"Color", barber:"Barber", braids:"Braids & locs", nails:"Nails", brow_lash:"Brows & lashes", wax:"Waxing"};
  const groups = {};
  ORDER.forEach(s => (groups[s.family] = groups[s.family] || []).push(s));
  $("#svc").innerHTML = Object.keys(fam).filter(f => groups[f]).map(f => `<optgroup label="${fam[f]}">${groups[f].map(s => `<option value="${s.code}">${esc(s.label)}</option>`).join("")}</optgroup>`).join("");
  $("#svc").value = "cut_women";
  const list = Object.entries(LOOKUP.cities).sort((a, b) => b[1].n - a[1].n);
  window.CITY = LOOKUP.cities;
  $("#place").innerHTML = `<option value="metro">All of the Twin Cities</option>` + list.sort((a, b) => a[0].localeCompare(b[0])).map(([c]) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  $("#place").value = "Minneapolis";
  svcChanged();
}
function keysFor(code){
  // only offer a size or a stylist level that at least MIN shops price
  return LOOKUP.keys[code] || {sizes:[""], tiers:["unknown"]};
}
function svcChanged(){
  const code = $("#svc").value, k = keysFor(code);
  const sz = k.sizes.filter(s => s), tr = k.tiers.filter(t => t !== "unknown");
  $("#sizeWrap").classList.toggle("hidden", !sz.length);
  $("#size").innerHTML = `<option value="">Any size not named</option>` + sz.map(s => `<option value="${s}">${esc(SIZE_WORD[s] || s)}</option>`).join("");
  $("#tierWrap").classList.toggle("hidden", !tr.length);
  $("#tier").innerHTML = `<option value="unknown">One price for every stylist</option>` + ["junior","stylist","senior","master","owner"].filter(t => tr.includes(t)).map(t => `<option value="${t}">${TIER_WORD[t]}</option>`).join("");
  showSvc();
}
async function showSvc(){
  const code = $("#svc").value, size = $("#size").value || "", tier = $("#tier").value || "unknown";
  const place = $("#place").value;
  const pt = place === "here" ? HERE : place === "metro" ? null : CITY[place];
  const tok = (showSvc.tok = (showSvc.tok || 0) + 1);
  let a;
  try {
    a = FULL ? SalonCore.svcAnswer(SHOPS, code, size, tier, pt, place === "here" ? "you" : place)
      : await preview(new URLSearchParams({svc: code, size, tier, place, ...(place === "here" && HERE ? {lat: HERE.lat, lng: HERE.lng} : {})}).toString());
  } catch (e) { $("#svcOut").innerHTML = `<p class="none">Couldn't load prices. Refresh to try again.</p>`; return; }
  if (tok !== showSvc.tok) return;
  if (!a.ok){ $("#svcOut").innerHTML = `<p class="none">Not enough shops list ${esc(svcName(code, size).toLowerCase())}${tier !== "unknown" ? " for " + TIER_WORD[tier] : ""} yet.</p>`; return; }
  const plus = a.starting ? "+" : "";
  const otherLine = a.otherMed != null ? `${a.nOther} more shops ${!a.starting ? "only post a starting price; their middle is " + money(Math.round(a.otherMed)) + "+" : "post a set price; their middle is " + money(Math.round(a.otherMed))}.`
    : a.nOther ? `${a.nOther} more ${a.nOther === 1 ? "shop" : "shops"} ${!a.starting ? "only post a starting price" : "post a set price"}, ${FULL ? "listed below" : "in the full table"}.` : "";
  const more = a.n - a.list.length;
  $("#svcOut").innerHTML = `<p class="sub" style="margin:0;color:var(--soft)">${esc(svcName(code, size))}${tier !== "unknown" ? " · " + TIER_WORD[tier] : ""}, ${esc(a.label)}</p>
    <p class="big">${money(Math.round(a.med))}${plus}</p>
    <p style="margin:0">is the middle ${a.starting ? "starting " : ""}price of ${a.nMain} shops. Most charge <b>${money(Math.round(a.p25))}–${money(Math.round(a.p75))}${plus}</b>.</p>
    ${otherLine ? `<p style="margin:6px 0 0;color:var(--soft);font-size:14px">${otherLine}</p>` : ""}
    <div class="list">${a.list.map(x => `<div class="it"><span>${esc(x.shop.name)}<small>${esc(x.shop.city || "")}${pt ? ` · ${x.d.toFixed(1)} mi` : ""} · ${TYPE_ONE[x.shop.type] || ""}${x.shop.nt ? " · tip included" : ""}</small></span><b>${shown(x)}</b></div>`).join("")}</div>
    ${more > 0 ? Paywall.lockRow(`${more} more shops, by name and price`) : ""}`;
}

function mode(m){
  $("#tabShop").setAttribute("aria-pressed", m === "shop"); $("#tabSvc").setAttribute("aria-pressed", m === "svc");
  $("#shopMode").classList.toggle("hidden", m !== "shop"); $("#svcMode").classList.toggle("hidden", m !== "svc");
  Paywall.mount($(m === "shop" ? "#shopPay" : "#svcPay"));
}

async function boot(){
  const [shops, svc, lookup] = await Promise.all(["directory", "services", "lookup"].map(f => fetch(`/data/${f}.json`).then(r => r.json())));
  SHOPS = shops.map(s => ({...s, p: []})); META = svc.meta; ORDER = svc.services; ORDER.forEach(s => SVC[s.code] = s); LOOKUP = lookup;
  SHOPS.forEach(s => s._n = norm(s.name));
  $("#foot").innerHTML = `Prices are each shop's own published menu, read ${META.built}. ${META.shops} Twin Cities shops. Compared base price to base price. <a href="https://github.com/2016judea/salon-rates">How it's built</a>`;
  $("#q").addEventListener("input", e => search(e.target.value));
  $("#q").addEventListener("focus", e => { if (e.target.value && !SHOPS.find(s => s.name === e.target.value)) search(e.target.value); else e.target.select();
    if (matchMedia("(pointer:coarse)").matches) setTimeout(() => $(".search").scrollIntoView({behavior:"smooth", block:"start"}), 250); });
  $("#q").addEventListener("keydown", e => { if (e.key === "Enter"){ const b = $("#results button[data-id]"); if (b) b.click(); } });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#results").classList.add("hidden"); });
  $("#tabShop").addEventListener("click", () => mode("shop"));
  $("#tabSvc").addEventListener("click", () => mode("svc"));
  ["#svc"].forEach(s => $(s).addEventListener("change", svcChanged));
  ["#size", "#tier", "#place"].forEach(s => $(s).addEventListener("change", showSvc));
  $("#nearMe").addEventListener("click", () => {
    if (!navigator.geolocation) return;
    $("#nearMe").textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(p => {
      HERE = {lat: p.coords.latitude, lng: p.coords.longitude};
      if (!$("#place").querySelector('option[value="here"]')) $("#place").insertAdjacentHTML("afterbegin", `<option value="here">Near me</option>`);
      $("#place").value = "here"; $("#nearMe").textContent = "use where I am"; showSvc();
    }, () => { $("#nearMe").textContent = "location is off"; });
  });
  await Paywall.init({ slot: $("#shopPay"), ctx: TOKEN ? {token: TOKEN} : {}, onUnlock: async d => {
    FULL = true; SHOPS = d; SHOPS.forEach(s => { s._n = norm(s.name); s.n = s.p.length; });
    $(".brand small").innerHTML = '<span class="pw-unl">Full table unlocked</span>';
    const cur = SHOPS.find(s => s.name === $("#q").value) || SHOPS.find(s => s.id === decodeURIComponent(location.hash.slice(1)));
    if (cur) await showShop(cur);
    if (!$("#svcMode").classList.contains("hidden")) await showSvc();
  } });
  fillSvc();
  let want = decodeURIComponent(location.hash.slice(1));
  if (TOKEN) { const d = await preview("for=" + TOKEN).catch(() => null); if (d) want = d.shop; }
  // with nothing typed, open on the salon with the most services we can compare (measured 2026-10-15: 19)
  const start = SHOPS.find(s => s.id === want) || SHOPS.find(s => s.id === DEFAULT_SHOP);
  await showShop(start);
}
const DEFAULT_SHOP = "booksy:1785448";
boot();
</script>
